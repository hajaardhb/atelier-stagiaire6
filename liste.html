<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #06b6d4;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    /* Navigation */
    .navbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: grid; place-items: center;
      color: #fff; font-size: 1rem;
    }
    .nav-link {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: .9rem;
      padding: 9px 16px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      transition: transform .15s, box-shadow .15s;
    }
    .nav-link:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(79, 70, 229, .35); }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
      text-align: center;
      padding: 48px 20px 80px;
    }
    .hero h1 { font-size: 2rem; font-weight: 700; }
    .hero p { margin-top: 8px; opacity: .9; }
    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .2);
      font-size: .85rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    /* Contenu */
    .container {
      max-width: 1000px;
      margin: -40px auto 48px;
      padding: 0 16px;
    }

    #liste {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }

    .carte {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .08);
      transition: transform .25s, box-shadow .25s;
      animation: apparition .4s ease both;
    }
    .carte:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, .15);
    }
    .carte img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 12px;
      background: #e2e8f0;
    }
    .carte strong {
      display: block;
      margin-top: 14px;
      font-size: 1.02rem;
      font-weight: 700;
    }
    .carte .ville {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--primary);
      font-size: .8rem;
      font-weight: 600;
    }

    /* États (chargement / vide / erreur) */
    .etat {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--card);
      border-radius: 16px;
      color: var(--muted);
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .08);
    }
    .etat.erreur { color: #dc2626; }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand"><span class="brand-logo">🎓</span> Gestion des stagiaires</div>
    <a class="nav-link" href="index.html">+ Nouvelle inscription</a>
  </nav>

  <header class="hero">
    <h1>Stagiaires inscrits</h1>
    <p>Retrouvez tous les stagiaires déjà enregistrés</p>
    <span class="badge" id="compteur" hidden></span>
  </header>

  <main class="container">
    <div id="liste"><div class="etat">Chargement...</div></div>
  </main>

  <script>
    function afficherEtat(conteneur, texte, erreur) {
      conteneur.textContent = '';
      const div = document.createElement('div');
      div.className = 'etat' + (erreur ? ' erreur' : '');
      div.textContent = texte;
      conteneur.appendChild(div);
    }

    (async () => {
      const conteneur = document.getElementById('liste');
      const compteur = document.getElementById('compteur');
      try {
        const res = await fetch('/api/liste.php');
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        if (data.stagiaires.length === 0) {
          afficherEtat(conteneur, 'Aucun stagiaire inscrit.');
          return;
        }

        conteneur.textContent = '';
        compteur.hidden = false;
        compteur.textContent = `${data.stagiaires.length} stagiaire${data.stagiaires.length > 1 ? 's' : ''}`;

        data.stagiaires.forEach((s, i) => {
          const carte = document.createElement('div');
          carte.className = 'carte';
          carte.style.animationDelay = `${Math.min(i * 50, 500)}ms`;

          const img = document.createElement('img');
          img.src = s.photo;
          img.alt = `${s.prenom} ${s.nom}`;
          img.loading = 'lazy';

          const nom = document.createElement('strong');
          nom.textContent = `${s.prenom} ${s.nom}`;

          const ville = document.createElement('span');
          ville.className = 'ville';
          ville.textContent = `📍 ${s.ville}`;

          carte.append(img, nom, ville);
          conteneur.appendChild(carte);
        });
      } catch (err) {
        afficherEtat(conteneur, 'Impossible de charger la liste.', true);
      }
    })();
  </script>
</body>
</html>
